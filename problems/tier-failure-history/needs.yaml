# Need registry — levels 1 and 2 of the browse tree.
#
# Source of truth for `enum.need` in ../data-model.yaml. A leaf's `need:` must
# resolve to an `id` here. Added 2026-09-06: before this file, needs existed only
# as an H2 convention inside each tier file and a hand-kept markdown list in
# 00-index.md, so `need: air` on a leaf resolved to no record and the browse tree
# could not be generated.
#
# `id` must be unique across ALL tiers — needs are referenced by bare slug and omit
# the tier.
#
# status:
#   first-sweep  written before the current standards — no `### Where it worked`,
#                few or no `## Sources`. Real work, thin. Labelled so a reader can
#                tell the two epistemic classes apart. 26 of 36 files, 2026-09-06.
#   standard     meets the CLAUDE.md tier-file invariants
#   leafed       standard, and its `### India:` list has been enumerated into leaves
#
# `definition` and `description` are NOT fields here. They live in the tier
# file's lead area — the block between the `# Title` and the first `##`:
#   > <one-line definition, browse-card form>
#
#   <description paragraph(s): what the need is, what failing it means, the
#   scope axes, what is out of scope>
# corpus.mjs parses the leading `>` blockquote as `definition` and the prose
# after it as `description`. A file with no blockquote falls back to its title
# and the loader warns. Written at tier time by process-tier (step 4).

version: 1

tiers:
  1: {name: Physiological, gloss: "homeostasis — override frequency measured in hours to weeks"}
  2: {name: Safety,        gloss: "threat-buffering projected over time"}
  3: {name: Belonging,     gloss: "bonding as reproductive strategy + group cohesion"}
  4: {name: Esteem,        gloss: "status as the resource-access mechanism within a group"}
  5: {name: Meaning,       gloss: "persistence of abstract/symbolic extensions of self"}

