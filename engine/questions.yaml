  - id: p4_needs_legs
    kind: problem
    question: "Which response types does it need — activism, institution, enterprise, service?"
    claim_field: needs_legs
    multi: false
    retrieval: true
    bucket: problem-core
    depth_tier: full

  # A · Classification (4) — bucket "problem-classification"
  - id: p5_onset
