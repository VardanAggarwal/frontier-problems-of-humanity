    retrieval: true
    bucket: problem-who-works-it
    depth_tier: full

  # ===================================================== actor — 16 ====
  # Identity — split retrieval (q1, q6, q8) vs inference (q2, q3, q5, q7)
  # per poc1c-results.md §3.
  # 2026-09-19d: widened from "one concrete sentence" to a short paragraph
  # (`niehs`/`jj-spices`: the single-sentence answer read as thin/generic
  # boilerplate even when the source material supported more — nothing in
  # the pipeline pulls in richer actor narrative besides this field, so a
  # sentence cap was capping the whole platform's actor description, not
  # just this one question). `claim_field` stays `one_line` deliberately —
  # renaming the DB column/`actor.one_line` would ripple into every page
  # that reads it (`src/pages/actor/[id].astro`'s lede, `corpus.mjs`) for
  # no benefit; only the CONTENT grows; the id and field are historical
  # naming, not a promise the value is one line long.
  - id: q1_one_line
    kind: actor
    question: >-
      In a short paragraph (3-5 sentences): what does this actor actually
      do, concretely — not a category label. Describe what they build,
      run, fund, campaign for or enforce; who it's for or who's affected;
      and, if the source material supports it, how they go about it or
      what makes their approach distinctive. Every sentence must be
      grounded in the source text — do not pad with generic filler to
      reach length; a shorter, fully-grounded paragraph beats a longer one
      that guesses.
    claim_field: one_line
    multi: false
    retrieval: true
    bucket: actor-identity
    depth_tier: registry   # asked at both tiers; registry gets this cheap pass at minimum

  # Added 2026-09-19, closing a gap the 2026-09-18 run exposed:
  # globus-warehousing/ncml/lt-foods all got a `one_line` that reads as
  # generic company boilerplate ("provides warehousing services including
  # scheduling shipments, unloading goods...") because `one_line` answers
  # "what does it do", never "why does this platform care about it". The
  # candidate's own `evidence.hint` (why it was minted) is now passed into
  # the extraction prompt (`extract_prompt_batched`'s `hint` param,
  # `search_stage.extract_hint`) precisely so this question can be answered
  # against it instead of against the org's self-description alone.
  # `retrieval: false` (not an inference question like q2/q3/q5/q7 either —
  # it needs the actual source text, just not a separate retrieval-ranked
  # assembly pass): there is no measured retrieval_query for it yet, and
  # forcing one in without measurement would be exactly the kind of
  # unvalidated retrieval_query poc1b/poc1c's method exists to avoid.
  - id: q0_relevance
    kind: actor
    question: >-
      Given why this actor is being looked at (see the note above the
      sources, if one is given) and what its own sources say, one sentence
      on WHY it matters here — not what the org/person does in general
      (that is `one_line`'s job), but the specific thing that makes it
      relevant to whatever surfaced it. If neither the note nor the
      sources make that apparent, do not answer this question at all —
      never restate `one_line` or say "no reason given" as the answer;
      an absent answer here still leaves the hint itself as the floor
      (`worker.py`'s backfill), which is strictly more honest than a
      sentence manufactured to fill the field.
    claim_field: context
    multi: false
    retrieval: false
    retrieval_note: >-
      No AUC measurement exists for this question — added 2026-09-19,
      after poc1b/poc1c's sweep. Unlike q2/q3/q5/q7/q13, this is not a
      whole-record enum inference either: it is answered from the same
      passed-in source set every other question sees, anchored on the
      candidate's `hint` rather than a retrieval-ranked subset. Do not
      wire in an unmeasured retrieval_query for it later without running
      the same sweep the other buckets went through.
    bucket: null
    depth_tier: registry

  - id: q2_type
    kind: actor
    question: "Org or individual?"
    claim_field: type
    multi: false
    retrieval: false
    retrieval_note: >-
      PoC-1c: AUC 0.516 (preamble), 0.466 (Scope), at-or-below chance
      against every target tested, including the identity bucket's shared
      query (best 0.657 across the three). An enum classification inferred
      by reading the whole record, not a fact in one localized passage — no
      query string retrieves a passage for it. Answer from whatever context
      the retrieval questions (q1, q6, q8) already pulled.
    bucket: null
    depth_tier: registry

  - id: q3_legs
    kind: actor
    question: >-
      Which leg(s) — activism, institution, enterprise (market-payer only),
      service (donor-funded, no earned revenue)?
    claim_field: legs
    multi: true
    retrieval: false
    retrieval_note: >-
      PoC-1c: AUC 0.586 (preamble), 0.451 (Scope) — chance-adjacent
      everywhere tested. Judgment call synthesizing funding, scope and
      scale; not localized. Answer from context already fetched by q1/q6/q8.
    bucket: null
    depth_tier: registry   # `_template.md`'s `leg: []` frontmatter field carries no "tracked only" comment

  - id: q4_lifecycle
    kind: actor
    question: >-
      Operating, scaling, distressed, dormant, acquired, shut, or
      won-and-dissolved — and current as of what date?
    claim_field: lifecycle   # + lifecycle_as_of
    multi: false
    retrieval: true
    bucket: actor-lifecycle
    depth_tier: registry   # `_template.md`'s `lifecycle`/`lifecycle_as_of` frontmatter fields carry no "tracked only" comment

  - id: q5_ecosystem_role
    kind: actor
    question: "Funder, intermediary, capacity-builder, convener, field-builder, researcher, operator, or platform?"
    claim_field: "tag:ecosystem_role"
    multi: false
    retrieval: false
    retrieval_note: >-
      PoC-1c: AUC 0.539 (preamble), 0.552 (Scope) — chance-adjacent
      everywhere tested. Judgment call, not localized. Answer from context
      already fetched by q1/q6/q8.
    bucket: null
    depth_tier: registry
    depth_tier_resolved: >-
      Was UNCERTAIN/full (`ecosystem_role` predates `_template.md`'s
      frontmatter, so neither reading applied). Resolved to `registry`,
      changed from the `full` default: it's a single cheap categorical
      judgment from context already fetched by q1/q6/q8 (no extra query),
      the same shape as q2_type/q3_legs which are already `registry`, and
      it is orthogonal to leg — useful for crawler-layer classification
      (funder vs operator) even on a registry-depth actor.

  - id: q6_affected_led
    kind: actor
    question: >-
      Is leadership drawn from the harmed population (yes), an NGO/proxy
      speaking for them (no), or a mix (partial)?
    claim_field: affected_led
    multi: false
    retrieval: true
    bucket: actor-identity
    depth_tier: registry   # `_template.md`'s `affected_led` frontmatter field carries no "tracked only" comment

  - id: q7_representation_unit
    kind: actor
    question: "`local-affected`, `central-org`, `enterprise`, or `central-at-named-legitimacy-cost`?"
    claim_field: representation_unit
    multi: false
    retrieval: false
    retrieval_note: >-
      PoC-1c: AUC 0.430 (preamble), 0.493 (Scope) — the weakest of the four
      inference questions, below chance against the preamble. Judgment
      call, not localized. Answer from context already fetched by q1/q6/q8.
    bucket: null
    depth_tier: registry   # `_template.md`'s `representation_unit` frontmatter field carries no "tracked only" comment

  - id: q8_geography
    kind: actor
    question: "Where do they operate?"
    claim_field: geography
    multi: false
    retrieval: true
    bucket: actor-identity
    depth_tier: registry

  - id: q9_contact_route
    kind: actor
    question: "How would you actually reach them?"
    claim_field: contact_route
    multi: false
    retrieval: true
    bucket: actor-reach
    depth_tier: full   # `_template.md` marks `contact_route:` explicitly "# tracked only"

  # Status
  - id: q10_funding
    kind: actor
    question: >-
      At what financial scale do they operate — corpus, budget, or latest
      round/grant — and as of when? One dated sentence.
    claim_field: funding
    multi: false
    retrieval: true
    bucket: actor-status
    depth_tier: full
    # Narrowed 2026-09-13. This question formerly bundled "who funds them"
    # with "at what scale". The two halves serve different purposes and only
    # one pays for itself. Scale sizes the offer, and sizing the offer is
    # what makes a match legible: a ₹50L need introduced to a fund writing
    # $5M cheques is a bad introduction. Funder identity moved to
    # q10b_funder_identity, which is an edge rather than a field — see there.
    #
    # PoC-0b measured the old bundled question's search coverage at 3/12
    # (25%) among actors for which funding demonstrably applies. That number
    # is not a reason to widen the question; it is mostly a fact about funds,
    # which do not reliably publish their own funders and for which the
    # catalyst act does not depend on it.
    depth_tier_resolved: >-
      Confirmed `full` (unchanged). A dated funding/scale sentence needs
      the tracked dive's 3-5 sources, not the registry pass's single
      identity query — CLAUDE.md's ground test frames this exact digging
      as tracked-tier, and `_template.md`'s silence on `## Status` doesn't
      override that: silence there means "not yet annotated," not
      "registry-eligible" (the fields it does mark are opt-IN to full,
      not an exhaustive opt-out list).

  - id: q10b_funder_identity
    kind: actor
    question: >-
      Who funds them — the named funders, each as its own entry.
    claim_field: emits/edges
    multi: true
    retrieval: false
    retrieval_note: >-
      Not a field about the entity, a relation between two entities: who
      funds whom is an edge, and edges arrive through the emit path
      (`worker/problem_emit.py`, `_emit`'s edges loop) from co-occurrence on
      a page, not by retrieving a funding sentence. `impact-network-crawler`
      already traverses exactly this edge (funds / board / cohort /
      portfolio), which is how the catalyst layer is mapped at all.
      Retrieving a sentence to populate a relationship is the wrong
      instrument, and PoC-0b's 25% coverage on the applicable set is the
      cost of using it: search surfaces a funding page for a quarter of the
      organisations that certainly have funders, while the same fact falls
      out of the emit path for free wherever a page names both parties.
      Answer it from whatever context the retrieval questions already pulled,
      and let the edge carry it.
    bucket: null
    depth_tier: full

  - id: q11_scale_metric
    kind: actor
    question: >-
      The one checkable number showing actual reach (members, homes, users,
      revenue, units), dated — flag if self-reported.
    claim_field: scale_metric
    multi: false
    retrieval: true
    bucket: actor-status
    depth_tier: full
    depth_tier_resolved: "Confirmed `full` (unchanged), same as q10_funding — same `## Status` section, same reasoning: a checkable dated reach number is tracked-dive work."

  # Leg viability — §D q2/q3
  - id: q12_viability_note
    kind: actor
    question: >-
      What makes them viable on their leg specifically — the paying
      customer (enterprise), whether donor funding survives donor exit
      (service), affected-led-ness (activism), or whether their authority
      contains the harm's source and its reporting unit matches the harm
      unit (institution)?
    claim_field: "tag:viability_note"
    multi: false
    retrieval: true
    bucket: actor-status
    depth_tier: full
    depth_tier_resolved: >-
      Confirmed `full` (unchanged). This is the §D leg-viability synthesis
      itself — it presupposes `legs` and enough source depth to know who
      pays / whether affected-led / whether authority contains the source,
      none of which a single registry identity query surfaces. Tracked-only.

  - id: q13_failure_note
    kind: actor
    question: "Where has this actor deployed effort and had it fail, and why? Omit if the source shows no failure — don't invent one."
    claim_field: "tag:failure_note"
    multi: false
    retrieval: false
    retrieval_note: >-
      PoC-1c: AUC 0.243 against `Status` — below chance. A direct grep
      found failure vocabulary in only ~10/289 actor files; this is a
      content/coverage gap in the corpus, not a phrasing or bucketing
      problem, so no retrieval target is assigned. Currently unanswerable
      from most sources; answer only when the fetched text plainly states
      a failure, from whatever context is already in hand.
    bucket: null
    depth_tier: full
    depth_tier_resolved: "Confirmed `full` (unchanged), same as q12_viability_note — same §D pairing: failure-mode diagnosis is tracked-dive synthesis, and coverage is already rare (~10/289) so it's not worth a registry query on top."

  # Catalyst surface
  - id: q14_ask_need
    kind: actor
    question: "What does this actor say it needs (funding, partners, data, policy access)?"
    claim_field: "ask:need:<kind>"
    multi: true
    retrieval: true
    bucket: actor-needs
    depth_tier: full   # `_template.md` marks `needs:` explicitly "# tracked only"

  - id: q15_ask_offer
    kind: actor
    question: "What can it offer (funding, a channel, a service, distribution)?"
    claim_field: "ask:offer:<kind>"
    multi: true
    retrieval: true
    bucket: actor-offers
    depth_tier: full   # `_template.md` marks `offers:` explicitly "# tracked only"

  - id: q16_channel
    kind: actor
    question: >-
      What are its live follow channels (social handle, newsletter, RSS,
      Telegram/WhatsApp broadcast)? Give the exact URL or handle as it
      appears in the text — never construct one that isn't literally there.
      Only attribute a channel to this actor if the text ties it to them by
      name, bio, or byline, not just topical proximity. When the text shows
      a named individual's own channel distinct from the org's, prefer that
      person's channel (they're already captured separately via `emits` —
      don't duplicate their channel here as the org's) — the org channel is
      the fallback, not the default.
    claim_field: "channel:<kind>"
    multi: true
    retrieval: true
    bucket: actor-reach
    depth_tier: full
    depth_tier_resolved: >-
      RESOLVED in favour of CLAUDE.md, per the build instructions: a real
      conflict existed between `_template.md`'s `sources:` field (not
      marked "tracked only") and `CLAUDE.md`'s Actor tracking section,
      which says explicitly "Don't run `actor-channel-finder` for a
      `registry` actor." CLAUDE.md wins — channel-hunting stays
      `tracked`-only (`full`, unchanged from the default). `_template.md`'s
      "no reachable channel -> one row" rule still applies once an actor
      IS in the tracked pass; it just never triggers a channel search for
      a registry actor in the first place.

# ============================================================ buckets ====
# Retrieval buckets — one e5 `query:` string per bucket, swept in
# `engine/poc/poc1b_phrasing.py` (per-question axes) and merged/revised in
# `engine/poc/poc1c_buckets.py` (bucket-wide sweep: shared query = whichever
# candidate, from any question in the bucket, scores best against the
# bucket's target section). `retrieval_query_source: measured` means the
# string and its AUC come from one of those two scripts' recorded output;
# `heuristic` means no PoC measured it and the string instead follows the
# two rules that generalised across the sweep (PoC-1b finding 2: never name
# the entity type; prefer noun-phrase/statement-shaped over a question).

buckets:

  # ---- actor side ----------------------------------------------------
  - id: actor-reach
    kind: actor
    questions: [q9_contact_route, q16_channel]
    target_section: "actor `## How to reach them`"
    retrieval_query: "contact email website social media handle channel"
    retrieval_query_source: measured
    auc: 0.893
    measured_against: "actor `## How to reach them` (H2-recovered label)"
    measured_n: 223
    note: >-
      poc1b: this string is q9's own keyword_list winner (AUC 0.893 solo).
      poc1c cross-apply: ties q9's dedicated best (0.893) and beats q16's
      dedicated best (0.790) by +0.103 — the merge is free.

  - id: actor-status
    kind: actor
    questions: [q10_funding, q11_scale_metric, q12_viability_note]
    target_section: "actor `## Status`"
    retrieval_query: "funding source, scale, latest round or grant, date"
    retrieval_query_source: measured
    auc: 0.977
    measured_against: "actor `## Status` (H2-recovered label)"
    measured_n: 205
    note: >-
      poc1b: this string is q10's own noun_phrase winner (AUC 0.977 solo).
      poc1c cross-apply: ties q10's dedicated best (0.977), beats q11's
      dedicated best (0.931) by +0.046 — merge is free. q12 (viability)
      moved into this bucket on separate evidence: its own noun_phrase
      candidate ("viability, unit economics, funding continuity, effort
      that failed") scores 0.873 against `Status` directly (control:
      0.835) — not the same string as this bucket's shared query, but high
      enough that `Status` prose substantively overlaps what q12 asks, so
      folding it in rather than giving it a dedicated retrieval is
      reasonable. q12's own AUC (0.873) has not been re-measured against
      this bucket's exact shared string.

      Split note, 2026-09-13: q10 was narrowed to scale-only and funder
      identity left this bucket as q10b_funder_identity (retrieval: false,
      edge-borne). This bucket's retrieval_query is deliberately UNCHANGED
      and its 0.977 remains valid — the query's job is to find the `##
      Status` section, and that section carries the scale half as well as
      the funder half, so narrowing the question does not invalidate a
      measurement that was never of the funder clause specifically. A
      re-sweep leading with scale rather than "funding source" may do
      better and has not been run.

  - id: actor-lifecycle
    kind: actor
    questions: [q4_lifecycle]
    target_section: "actor `## Recent updates`"
    retrieval_query: "lifecycle status and as-of date"
    retrieval_query_source: measured
    auc: 0.919
    measured_against: "actor `## Recent updates` (H2-recovered label)"
    measured_n: 282
    note: >-
      Retargeted off `Status` (control AUC there: 0.688, best alternative
      −0.009, CI crosses zero — control would have stayed). Reading actual
      sections showed `## Status` is almost entirely two fixed bullets
      (Funding, Scale metric — q10/q11's own content) and rarely states
      operating/dormant/etc; `## Recent updates` is the reverse-chron log
      where lifecycle language actually lives. Retargeting + rephrasing
      together: 0.688 -> 0.919 (+0.231). Single-question bucket: no other
      question shares this target.

  - id: actor-needs
    kind: actor
    questions: [q14_ask_need]
    target_section: "actor `## What they need`"
    retrieval_query: "requires funding, seeks partners, needs data or policy access"
    retrieval_query_source: measured
    auc: 0.556
    measured_against: "actor `## What they need` (H2-recovered label)"
    measured_n: 99
    caveat: >-
      Smallest sample of the actor-side sweep (99 of 289 files carry this
      section, fewest of any). Best of six phrasing axes (vocab_overlap)
      beats control by only +0.039 (0.518 -> 0.556), both barely above the
      0.5 chance floor. poc1b's read: content problem, not a phrasing
      problem — most "What they need" sections are thin/generic ("more
      funding and partners") and give e5 nothing lexically distinctive to
      lock onto regardless of query wording. Kept `retrieval: true` because
      a query does exist and scores (barely) above chance, but downstream
      consumers should not expect this bucket's retrieval to reliably
      surface the right passage; a content-coverage fix (matching the
      whole file rather than one paragraph) was proposed and not built.

