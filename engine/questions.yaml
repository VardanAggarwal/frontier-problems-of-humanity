  - id: actor-identity
    kind: actor
    questions: [q1_one_line, q6_affected_led, q8_geography]
    target_section: "actor preamble (\"What they do.\" lead paragraph, before any H2)"
    retrieval_query: "In one concrete sentence: what does this actor actually do?"
    retrieval_query_source: measured
    auc: 0.917
    measured_against: "actor preamble (H2-recovered label, empty-heading chunk)"
    measured_n: 289
    caveat: >-
      This is q1's own dedicated control string (`poc1c_run_output.txt`
      confirms it beats the two other IDENTITY_SHARED_CANDIDATES —
      noun_phrase 0.502, statement_shaped 0.637 — on the same preamble
      target). q6 and q8 were not re-scored against this exact shared
      string; their own dedicated-question AUCs against the preamble are
      0.777 (q6) and 0.959 (q8) respectively — both comfortably above the
      chance-adjacent scores every candidate gets on `## Scope` (the only
      other tested target), which is why the bucket points at the preamble
      rather than `## Scope` or their union. Sharing q1's string across all
      three is a judgment call carried over from the identity split, not a
      separately measured 3-question shared-query AUC.

  # ---- problem side ----------------------------------------------------
  - id: problem-core
    kind: problem
    questions: [p1_one_line, p2_status, p3_geography, p4_needs_legs]
    target_section: "leaf lead prose (definition + description, before any H2 — the `> ...` blockquote and the paragraph after it, per `_tier-template.md`/corpus.mjs)"
    retrieval_query: "Definition and scope of the harm, and its documented occurrence in India — who is affected, where, at what scale — with the kind of response it needs"
    retrieval_query_source: heuristic
    note: >-
      Untested — poc1c-results.md §5 explicitly flags these four as
      "presumptively inference-only... but that is untested, not assumed."
      No PoC swept this target on the leaf corpus (A-E only). Written per
      the two rules that generalised across PoC-1b's sweep: never name the
      entity type ("this problem"/"this failure" was a consistent loser on
      the actor side), and prefer a noun-phrase/statement-shaped string
      over question grammar. A single shared query is a judgment call, not
      a measured merge — resweep before trusting this bucket's AUC, which
      does not exist yet.

      Reworded 2026-09-14 (still heuristic, no re-measurement done) to add
      an explicit "occurrence in India" clause. Live-tested on `cookfire-
      smoke`: the pre-existing generic wording ("failure definition, scope,
      geography, and response types needed") let a global projection paper
      and a China cohort study win this bucket on every run, so p3_geography
      answers came back "China" / "Global... Sub-Saharan Africa" — the
      bucket's own retrieval string never named the corpus's actual
      geographic anchor, so nothing in it competed for an India-specific
      chunk. `families.yaml`'s search-side India bias (added same day) was
      NOT enough on its own — it changed what got fetched (a WHO fact sheet
      entered the pool for the first time) but not what this bucket
      selected, because selection ranks by similarity to THIS string, not
      to the search query. Re-measure before trusting any AUC claim here;
      this is still a first cut, now a more specific one.

