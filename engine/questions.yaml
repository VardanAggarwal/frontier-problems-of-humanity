  # B · Evidence (3) — bucket "problem-evidence"
  - id: p9_magnitude
    kind: problem
    question: >-
      Magnitude with its denominator, dated and sourced — a number alone is
      not an answer, it needs what it is a fraction of.
    claim_field: "tag:magnitude"
