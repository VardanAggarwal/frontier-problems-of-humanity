# The question registry — F1, `04-worker-build-plan.md` §1a / §4 contract 2.
#
# Single home for the ~35 questions' text, stable ids, claim fields, and tier
# flags, so `prompts.py` (extraction) and stage 5 (passage retrieval) read the
# same strings instead of each carrying their own copy. Source of the question
# set: `engine/02-questions.md` — that file is still the authority on what a
# `problem`/`actor` record must answer; this file is the join key. Do not add,
# drop or reword a question here without updating `02-questions.md` first.
#
# Retrieval strings and bucket AUCs are measured in `engine/poc/poc1b-results.md`
# (per-question phrasing sweep) and `engine/poc/poc1c-results.md` (bucket
# design, revised over 1b) — read those before changing a `retrieval_query` or
# a bucket's membership. Loader: `engine/worker/questions.py`.
#
# id scheme: "p<N>_<slug>" for the 19 problem questions, "q<N>_<slug>" for the
# 16 actor questions, N matching `02-questions.md`'s own `#` column and the
# slug matching `claim_field` (tag namespace stripped of `tag:`) — this is
# also the exact naming PoC-1b/1c already used (p7_channel, q9_contact_route,
# ...), so ids here are traceable straight back to the measured numbers above
# without a second mapping table. p/q prefixes are disjoint, so ids are unique
# across both kinds without a further namespace.

questions:

  # ==================================================== problem — 19 ====
  # Core (4) — untested by PoC-1c; presumptively inference-only (lead prose
  # + title carry these), same logic as actor identity, but that is an
  # assumption per poc1c-results.md §5, not a measurement. Flagged below.
  - id: p1_one_line
    kind: problem
    question: "In one sentence: what is the failure, stated as a browse-card definition?"
    claim_field: one_line
    multi: false
    retrieval: true
    bucket: problem-core
    depth_tier: full

  - id: p2_status
