# Track D (`04-worker-build-plan.md` §5) — the query-family registry.
#
# Family ids and query templates are derived from what PoC-0b actually ran
# (`poc/poc0b_families.yaml`, verified here directly against the `family` and
# `query` fields recorded across all 120 files in `poc/poc0b-responses/`) —
# not invented. `{name}` is the actor's display name, substituted verbatim.
#
# PoC-0b's own templates wrapped `{name}` in literal quotes (exact-phrase
# match). Dropped 2026-09-14: for a `problem`-kind candidate, `{name}` is a
# multi-word descriptive title, not a proper noun — quoting it as an exact
# phrase returns near-nothing (nobody publishes that literal sentence), and
# it made every family collapse into a single near-empty result set. Bare
# terms let the search engine's own relevance ranking work. Actor names are
# short enough that this costs little precision on that kind.
#
# PoC-0b's 7th family from `03-worker.md` §3 (`asks`) was dropped from that
# PoC to land on 20 x 6 = 120 queries — it is not present in the recorded
# data and is therefore not in this registry. Adding it back is a candidate
# for later, not done here (track D's brief is to derive from what PoC-0b
# ran, not to re-add the dropped 7th).
#
# `kind` (added 2026-09-14): every family below this point was PoC-0b's, and
# PoC-0b only ever ran actor names — so all six are `kind: actor`, and until
# now a `problem`-kind candidate was run through them unchanged (nonsense:
# "founder director leadership" / "revenue customers model" / "contact
# twitter newsletter" asked of a disease or a policy failure). `render_queries`
# defaults to `kind="actor"` for backward compatibility with every existing
# caller and test; `search_sources` now passes the candidate's own `kind`.
# The `problem` family set below is derived from `questions.yaml`'s p1-p19
# (kind: problem) buckets, not from a PoC — there is no PoC-0-equivalent for
# problem candidates yet, so these templates are a first cut, not a measured
# one, and should be revisited the way `failure`'s 28% finding revisited
# actor's.

families:
  - id: identity
    kind: actor
    query_template: '{name}'
    retrievable: true

  - id: money
    kind: actor
    query_template: '{name} funding raised grant crore'
    retrievable: true

  - id: people
    kind: actor
    query_template: '{name} founder director leadership'
    retrievable: true

  - id: viability
    kind: actor
    query_template: '{name} revenue customers model'
    retrievable: true

  - id: reach
    kind: actor
    query_template: '{name} contact twitter newsletter'
    retrievable: true

  # Added 2026-09-19, not PoC-0b-measured (same caveat as the `problem`
  # families below — a first cut, re-tune from real runs). `reach`'s
  # generic '{name} contact twitter newsletter' relies on ONE query
  # surfacing whichever platform an actor happens to be on; it measurably
  # doesn't for a common-name individual or a generic-sounding company
  # (ncml/arjun-subedi, 2026-09-18 run: real channels — ncml.com,
  # twitter.com/CeetleHero — existed in `finding` but never became a
  # `channel` row because search never targeted the platform directly and
  # the extraction claim-field routing was separately broken, fixed
  # alongside this). One `site:` query per major platform costs one extra
  # search-provider call each but makes each platform's own top result
  # available to `cover()`, rather than hoping one generic query's top-N
  # happens to include it.
  - id: channel_linkedin
    kind: actor
    query_template: '{name} site:linkedin.com'
    retrievable: true

  - id: channel_twitter
    kind: actor
    query_template: '{name} site:twitter.com OR site:x.com'
    retrievable: true

  - id: channel_facebook
    kind: actor
    query_template: '{name} site:facebook.com'
    retrievable: true

  - id: channel_instagram
    kind: actor
    query_template: '{name} site:instagram.com'
    retrievable: true

  - id: channel_website
    kind: actor
    query_template: '{name} official website'
    retrievable: true

  # Added 2026-09-19, alongside the five `channel_*` families above but
  # covering platforms `channels_from_confirmed` (`worker/search_stage.py`)
  # has no URL pattern for yet — newsletter/Substack/Telegram (grassroots,
  # researcher and movement actors that don't run an org website) and the
  # Indian civic-journalism aggregators (IndiaSpend, Scroll, The Wire, Down
  # To Earth, Mongabay-India, Article 14) actor-channel-finder falls back to
  # when a direct search finds nothing — bylines, coalition/speaker pages
  # that name the working contact.
  - id: channel_feed
    kind: actor
    query_template: '{name} newsletter OR substack OR telegram'
    retrievable: true

  - id: channel_press
    kind: actor
    query_template: '{name} site:indiaspend.org OR site:scroll.in OR site:thewire.in OR site:downtoearth.org.in OR site:mongabay.com OR site:article-14.com'
    retrievable: true

  - id: failure
    kind: actor
    query_template: '{name} shut down closed pivot losses'
    # PoC-0b finding (poc/poc0b-results.md, "Real-run results — per-family
    # predicted coverage"): failure scored 28% predicted coverage, the
    # lowest of all six families, and this independently corroborates PoC-1c
    # (q13_failure_note AUC 0.243 on labelled-chunk retrieval, failure
    # vocabulary present in only ~10 of 289 corpus files). Two unrelated
    # methods agree: organisations do not publish their own failures. Kept
    # in the registry (per the plan doc's instruction not to delete it) but
    # flagged non-retrievable rather than treated as a retrieval bug to fix.
    retrievable: false

  # ---------------------------------------------------------------- problem
  # First cut, not PoC-measured. Mapped from questions.yaml's problem buckets:
  # problem-evidence (p9 magnitude+denominator, p11 measurement_state),
  # problem-who-works-it (p19 who_working — the family that actually answers
  # "find related individuals"), problem-diagnosis (p14 blocker), problem-core
  # (p3 geography, already folded into `identity` via the candidate's own name
  # rather than a separate query).
  #
  # Every template below carries a literal `India` term (added 2026-09-14,
  # live-tested against `cookfire-smoke`). `SearxngProvider`'s own
  # `language=en-IN` locale default (`search/provider.py`) was NOT enough on
  # its own: a live run on `cookfire-smoke` (no seed URL, `evidence`/
  # `coverage` queries) returned a Nature global-projection paper and a
  # Frontiers China breast-cancer cohort study as the ONLY confirmed sources —
  # zero India-specific material reached the extraction prompt, and every
  # `p3_geography` finding came back China/global despite en-IN. `CLAUDE.md`'s
  # "India-anchored" scope rule is a corpus-content rule, not a locale
  # setting; a locale param nudges which engines/results rank but does not
  # filter the underlying document's own geography the way a literal query
  # term does. Not yet re-measured after this change — see the file's own
  # framing above: this is a first cut, re-tune from real runs.
  - id: problem_identity
    kind: problem
    query_template: '{name} India'
    retrievable: true

  - id: evidence
    kind: problem
    query_template: '{name} India data statistics prevalence denominator'
    # p9_magnitude / p11_measurement_state: a number with what it's a
    # fraction of, or the explicit absence of one.
    retrievable: true

  - id: who_works_it
    kind: problem
    query_template: '{name} India NGO organisation working on'
    # p19_who_working: every actor the text supports, across all four legs
    # (activism/institution/enterprise/service) — this is the family that
    # produces the emits/edges the candidate-discovery goal depends on.
    # Kept as-is (identity/activism-leaning) but no longer the ONLY query
    # for this bucket — split 2026-09-14 into per-leg siblings below, since
    # a single "NGO organisation" phrasing structurally biases retrieval
    # toward the activism leg and away from enterprise/institution/service
    # actors that never call themselves an NGO.
    retrievable: true

  - id: who_works_it_enterprise
    kind: problem
    query_template: '{name} India startup company solution product'
    # Enterprise leg: market-payer orgs selling a remedy. "NGO organisation"
    # above will not surface these — different vocabulary entirely.
    retrievable: true

  - id: who_works_it_institution
    kind: problem
    query_template: '{name} India government department scheme regulator'
    # Institution leg: the body whose authority should contain the source.
    # Overlaps `policy` below by design — this one is actor-shaped (WHO),
    # policy below is instrument-shaped (WHAT).
    retrievable: true

  - id: who_works_it_service
    kind: problem
    query_template: '{name} India donor funded charity trust foundation'
    # Service leg: donor/philanthropy-funded direct delivery, no earned
    # revenue — distinct vocabulary from both the enterprise and activism
    # queries above.
    retrievable: true

  - id: policy
    kind: problem
    query_template: '{name} India government scheme policy'
    # p14_blocker / p4_needs_legs: institution-leg coverage and the fiscal/
    # political/technical constraint keeping a known fix from happening.
    retrievable: true

  - id: coverage
    kind: problem
    query_template: '{name} India report investigation'
    # p10_diff_vuln / p13_burden_note: press/investigative coverage is where
    # differential-vulnerability and visible-vs-load-bearing-cause material
    # actually shows up, not in reference/encyclopedia pages.
    retrievable: true

  - id: mechanism_gap
    kind: problem
    query_template: '{name} India why not fixed enforcement gap blocker'
    # p12_mechanism / p13_burden_note / p14_blocker: the leaf's `## C ·
    # Diagnosis` section. No family above targets diagnosis/blocker material
    # directly — `policy` finds the instrument, this one hunts for why it
    # isn't working (enforcement gap, stuck blocker), which is a different
    # vocabulary entirely.
    retrievable: true

  - id: diff_vulnerability
    kind: problem
    query_template: '{name} India most affected vulnerable cannot afford no alternative'
    # p10_diff_vuln: who is hit hardest and why they can't exit or defend
    # against it. The worst-measured retrieval bucket downstream (AUC 0.225
    # per questions.yaml's own note) and nothing searches for it specifically
    # today — `coverage` catches some of this incidentally but was never
    # aimed at it.
    retrievable: true

  - id: problem_failure
    kind: problem
    query_template: '{name} India scheme failed ineffective underperforming shortfall'
    # The problem-kind analogue of actor's `failure` family above. Targets
    # p13_burden_note reconciliation material — official-vs-independent
    # gaps, a scheme declared successful on paper but not in outcomes (the
    # "official 61% vs independent ~28%" sewage-treatment precedent the
    # project's CLAUDE.md names). Nothing today searches for "this response
    # failed or underperformed" on the problem side.
    retrievable: true
